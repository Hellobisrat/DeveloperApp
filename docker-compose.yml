services:
  mongodb:
    image: mongo
    container_name: developerapp-mongodb
    env_file:
      - .env
    volumes:
      - mongo-data:/data/db
    networks:
      - develnet

  backend:
    build: ./backend
    container_name: developerapp-backend
    env_file:
      - .env
    depends_on:
      - mongodb
    ports:
      - "${BACKEND_PORT}:9000"
    networks:
      - develnet

  frontend:
    build: ./frontend
    container_name: developerapp-frontend
    env_file:
      - .env
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT}:3000"
    networks:
      - develnet

networks:
  develnet:
    driver: bridge

volumes:
  mongo-data:
